<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Kairós Imobiliária</title>
    <meta name="description" content="CRM imobiliário premium da plataforma Kairós, com Aion como consultor inteligente." />

    <!-- PWA Meta tags and Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0f1f" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple Web App Capable tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kairós" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register service worker for installable app badge -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker cadastrado com sucesso!', reg.scope))
            .catch(err => console.error('Erro ao cadastrar PWA Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
